# Finture local — proxy "edge".
# Único ponto de entrada HTTP do navegador. Rails e Vite ficam numa rede Docker
# interna (sem rota para a internet); o edge fica nas duas redes e só publica
# portas em 127.0.0.1 (ver docker-compose.local.yaml).

# Resolve os upstreams sob demanda: o edge sobe mesmo se rails/vite ainda não existirem.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

client_max_body_size 50m;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

# Rails/Puma + ActionCable (/cable)
server {
  listen 3000;
  set $rails_upstream http://rails:3000;

  location / {
    proxy_pass $rails_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

# Vite dev server (HMR via WebSocket)
server {
  listen 3036;
  set $vite_upstream http://vite:3036;

  location / {
    proxy_pass $vite_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host vite:3036;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
